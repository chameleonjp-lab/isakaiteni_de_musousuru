name: Castle release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified main branch to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify the playable page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and verify the game
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
            -o "$RUNNER_TEMP/three.min.js"
          python -B playable/build.py "$RUNNER_TEMP/castle-site/index.html" \
            --three "$RUNNER_TEMP/three.min.js" --revision "$GITHUB_SHA"
          node playable/verify.cjs
          python -B scripts/verify_scenario.py
          node playable/stages/verify.cjs "$RUNNER_TEMP/three.min.js"
      - name: Install Chromium for browser tests
        working-directory: playable
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Test the built page in Chromium
        run: node playable/verify-browser.cjs "$RUNNER_TEMP/castle-site/index.html"
      - name: Save the verified HTML
        uses: actions/upload-artifact@v7
        with:
          name: castle-escape-html
          path: ${{ runner.temp }}/castle-site/index.html
          if-no-files-found: error
          retention-days: 7
      - name: Prepare the Pages archive
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/castle-site

  deploy:
    name: Publish the verified page
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: castle-github-pages
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that the verified commit is still on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping an older version. main is now $main_sha."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
