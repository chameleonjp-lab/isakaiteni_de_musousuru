<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151e23">
  <title>王都からの脱出</title>
  <style>/* CASTLE_CSS */</style>
</head>
<body class="game-page">
  <header class="top">
    <div class="title">王都からの脱出</div>
    <div class="top-actions">
      <button type="button" id="audio" aria-pressed="true">音あり</button>
      <button type="button" id="help" aria-label="遊び方">遊び方</button>
    </div>
  </header>
  <main class="play">
    <section id="stage" class="stage" aria-label="城内の様子">
      <canvas id="castle-canvas" aria-hidden="true"></canvas>
      <div class="drawing" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="veil"></div>
      <div class="stage-top">
        <span id="clock"></span>
        <span id="collar"></span>
      </div>
      <div class="stage-cameras" aria-label="視点">
        <button type="button" id="stage-close" aria-pressed="false" hidden>手元</button>
        <button type="button" id="stage-door" aria-pressed="false" hidden>扉を見る</button>
      </div>
      <div class="stage-bottom">
        <p id="district"></p>
        <h1 id="room"></h1>
        <p id="feature"></p>
      </div>
      <div id="toast" role="status" hidden></div>
      <button type="button" id="walk-stick" aria-label="移動スティック（矢印キーでも移動できます）" hidden><span></span></button>
      <p id="walk-passage" hidden></p>
    </section>
    <section class="desk" id="desk" aria-label="行動と記録" data-open="false">
      <nav class="tabs" aria-label="操作">
        <button type="button" data-tab="scene" aria-controls="desk-panel" aria-pressed="true">調べる</button>
        <div class="tabs-tools">
          <button type="button" id="walk-tab" data-tab="walk" aria-controls="desk-panel" aria-pressed="false">出口</button>
          <button type="button" data-tab="notes" aria-controls="desk-panel" aria-pressed="false">手帳</button>
          <button type="button" data-tab="items" aria-controls="desk-panel" aria-pressed="false">持ち物</button>
        </div>
      </nav>
      <button type="button" id="audience-call" class="primary" hidden></button>
      <div class="desk-panel" id="desk-panel">
        <button type="button" id="desk-close">探索に戻る</button>
        <div id="content" class="content" tabindex="-1"></div>
      </div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <span class="dialog-kicker" id="dialog-kicker"></span>
      <button type="button" id="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="dialog-content">
      <h2 id="dialog-title"></h2>
      <div id="dialog-copy"></div>
      <button type="button" id="dialog-next" hidden><span id="dialog-hint"></span></button>
    </div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </dialog>
  <noscript>このゲームを遊ぶには、ブラウザの JavaScript を有効にしてください。</noscript>
  <script>/* CASTLE_SCRIPT */</script>
</body>
</html>
